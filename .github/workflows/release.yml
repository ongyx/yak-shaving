name: release

defaults:
  run:
    shell: bash

on:
  schedule:
    - cron: "0 0 * * 0"

  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update-submodules:
    name: Update Submodules
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      updated: $[{ steps.check.outputs.updated }]

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update submodules
        run: |
          git submodule update --recursive --init
          git submodule update --recursive --remote

      - name: Check updated submodules
        id: check
        run: |
          declare -a updated

          while read -r line; do
              sha="$(echo "$line" | cut -d' ' -f1)"
              name="$(echo "$line" | cut -d' ' -f2)"
              if [[ "$sha" == +* ]]; then
                  updated+=("$name")
              fi
          done < <(git submodule status)

          echo "updated=${updated[@]}" >> "$GITHUB_OUTPUT"

      - name: Commit updated submodules
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "chore: Update submodules" || echo "Nothing to commit"

          git push

      - name: Commit updated submodules
        uses: planetscale/ghcommit-action@v0.2.22
        if: ${{ steps.check.outputs.updated != '' }}
        with:
          commit_message: "chore: Update submodules"
          repo: ${{ github.repository }}
          branch: ${{ github.head_ref || github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-helix:
    name: Build Helix (Steel fork)
    needs: [update-submodules]
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || contains(needs.update-submodules.outputs.updated, 'submodules/helix') }}
    uses: ./.github/workflows/build-helix.yml

  build-steel:
    name: Build Steel
    needs: [update-submodules]
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || contains(needs.update-submodules.outputs.updated, 'submodules/steel') }}
    uses: ./.github/workflows/build-steel.yml

  publish:
    name: Publish
    needs: [build-helix, build-steel]
    # At least one package must've been built to update the apt repository.
    if: ${{ !cancelled() && (needs.build-helix.result == 'success' || needs.build-steel.result == 'success') }}
    uses: ./.github/workflows/publish.yml
